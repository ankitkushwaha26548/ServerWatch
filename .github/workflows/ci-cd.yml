name: ServerWatch CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


permissions:
  contents: read
  packages: write


jobs:

  backend-test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6


      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"


      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt


      - name: Check backend imports
        run: |
          cd backend
          python -m compileall app



  frontend-build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6


      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"


      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install


      - name: Build frontend
        run: |
          cd frontend
          npm run build



  docker-build:

    runs-on: ubuntu-latest

    needs:
      - backend-test
      - frontend-build

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6


      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - name: Set image owner
        run: |
          echo "IMAGE_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV


      - name: Build and push backend image
        run: |
          docker build \
            -t ghcr.io/$IMAGE_OWNER/serverwatch-backend:latest \
            ./backend

          docker push \
            ghcr.io/$IMAGE_OWNER/serverwatch-backend:latest


      - name: Build and push frontend image
        run: |
          docker build \
            -t ghcr.io/$IMAGE_OWNER/serverwatch-frontend:latest \
            ./frontend

          docker push \
            ghcr.io/$IMAGE_OWNER/serverwatch-frontend:latest